<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thảo Linh - Trái Tim Lung Linh</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle, #ffdde1 0%, #ee9ca7 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .heart-container {
      position: relative;
      width: 600px;
      height: 600px;
      animation: heartbeat 2s infinite ease-in-out;
      filter: drop-shadow(0 0 30px rgba(255, 105, 135, 0.5));
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .heart-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 70px;
      font-family: 'Brush Script MT', cursive;
      color: white;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.05); }
      50% { transform: scale(0.95); }
      75% { transform: scale(1.1); }
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: -1;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="heart-container">
    <svg viewBox="0 0 100 100">
      <path d="M50 91s-1-.5-2-1.3C24 70 4 50 10 31c3-9 12-15 21-15 7 0 14 4 18 10 4-6 11-10 18-10 9 0 18 6 21 15 6 19-14 39-38 58-1 .8-2 1.3-2 1.3z" fill="#ff4d6d"/>
    </svg>
    <div class="heart-text">Thảo Linh</div>
  </div>

  <script>
    // particles hiệu ứng hạt sáng bay nhẹ
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 1.5 + 0.5;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
        this.alpha = Math.random() * 0.5 + 0.3;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
        ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
        ctx.fill();
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
        }
      }
    }

    function initParticles(count) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animateParticles);
    }

    initParticles(150);
    animateParticles();
  </script>
</body>
</html>
